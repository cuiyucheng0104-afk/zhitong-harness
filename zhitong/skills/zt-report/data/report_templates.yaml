          【格式】编号分条，每条一个文件，写全称与版本号（资料里有的才写）。

          【缺失处理】只列资料中实际出现的依据；资料没有的不列，不虚构文号与版本。
      - code: qufei
        title: 四、取费标准及材料价格说明
        seq: 50
        rag_query: 景观绿化工程 取费 费率 企业管理费 利润 规费 苗木 材料价格 人工单价
        gen_prompt: >
          【必备要素】①景观绿化工程取费费率（企业管理费、利润、规费、组织措施费、安全文明施工基本费、增值税、专项增加费）②材料价格取定（苗木、铺装石材、砂浆、砼等信息价与市场价口径）③人工单价取定。

          【取材】编制说明、取费表、苗木询价记录、造价信息期刊。

          【格式】（一）（二）（三）分块；费率与单价逐字照抄并注明[资料n]。

          【缺失处理】费率与单价资料里没有的留空并写「【待补：要素名】」，不套用标准费率。
      - code: shixiang
