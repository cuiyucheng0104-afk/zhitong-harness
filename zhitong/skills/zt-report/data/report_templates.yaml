# AI 初稿章节模板（24 套，③咨询成果 AI）。每章 gen_prompt = 该章写作要求（中文，LLM 直接用），
#   rag_query = 该章选材检索词；引擎按 template_code + section code 解析（resolve_section），不信任客户端传入的写作要求。
# gen_prompt 统一写成四段：【必备要素】【取材】【格式】【缺失处理】（PR-YAML 一期；jiesuan_shenhe_bg 三套与
#   zaojia_shendingdan 保持原写法）。程序性陈述（现场查勘、与建设/施工单位核对…）不写进 gen_prompt，放 claims，
#   由用户在「确认事项」一步勾选（WS12-P07）；附件/附表名称放 attachment_hints。
# ⚠ section code 是「单章重试」的定位键：改了它，旧初稿的该章重试会 422（模板章节不存在）。除月报外别改。
templates:
  - template_code: tzkz_monthly_v0   # code 保留 v0：旧初稿与测试按 code 定位；内容已不是测试骨架
    name: 投资控制月报(全过程造价咨询月报)
    enabled: true
    note: 章节骨架取自全过程/投资控制月报的高频结构，与模板库《全过程造价咨询月报》docx 的七章一一对应，AI 初稿可逐章贴入
    note_user: 投资控制月报：按七章写本统计期的工作概况、工程进展、投资完成与支付、咨询工作、重大事件、问题建议和下期计划；需要委托合同、施工合同、概算批复，以及本期的监理月报或施工周报、计量审核表、进度款支付审批表、变更签证台账、会议纪要；缺本期记录的章会是【待补】。
    sections:
      - code: gaikuang
        title: 一、项目工作概况
        seq: 10
        rag_query: 工程概况 建设单位 代建 施工单位 监理单位 批复概算 合同价 咨询范围 咨询依据 委托合同
        gen_prompt: >
          【必备要素】①工程总体概况（建设内容与规模、参建单位）②造价咨询范围（按委托合同）
          ③造价咨询工作依据（合同、计价规范、地方计价依据）。

          【取材】委托合同、施工合同、概算批复、项目汇总信息；已成稿月报只参考体例，不沿用其数字。

          【格式】（一）（二）（三）三个小节，每节 1 段，合计不超过 400 字；金额只作背景数，逐字照抄并注明[资料n]。

          【缺失处理】某要素资料里没有，写「【待补：要素名】」，不推算。
        excludes: ["本期工程进展（在「二、项目进展情况」一章写）", "本期投资完成与支付（在「三、项目投资控制总体情况」一章写）"]
        facts_allowed: ["contract_price"]
      - code: jinzhan
        title: 二、项目进展情况
        seq: 20
        rag_query: 形象进度 施工部位 本月 进度计划 滞后 原因 监理月报 周报
        gen_prompt: >
          【必备要素】①本期工程形象进度（按单体或部位）②与进度计划的差异及原因。

          【取材】监理月报、施工周报、进度计划、会议纪要；只取本统计期间的记录。

          【格式】（一）工程形象进度：按部位分条；（二）进度差异及原因分析：一段。

          【缺失处理】没有本期进度记录时整章写「【待补：本期形象进度资料】」，不得用上期内容代替。
        excludes: ["投资与支付金额（在「三、项目投资控制总体情况」一章写）"]
      - code: touzi
        title: 三、项目投资控制总体情况
        seq: 30
        rag_query: 投资 概算 合同价 本期完成 累计完成 进度款 支付 变更 签证 申报 审核 台账
        gen_prompt: >
          【必备要素】①项目整体投资情况：批复概算、合同价（背景数）、本期完成、累计完成、累计支付
          ②投资费用变更、签证：本期件数、申报与审核情况、办理状态
          ③投资控制分析：资料中载明的投资偏差数及原因。

          【取材】批复概算取概算批复，合同价取施工合同；本期完成、累计完成、累计支付取计量审核表、进度款支付审批表中截至本统计期末的数；
          变更签证取变更签证台账中本统计期间的记录。

          【格式】（一）一段总述加要素分条；（二）按变更签证逐条列「编号／内容／申报／审核／状态」；（三）一段分析，
          偏差数逐字照抄资料原文。每个金额逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的金额留空并写「【待补：要素名】」，不用合同价或上期数推算；资料没有载明偏差数的写「【待补：投资偏差】」，不自行计算偏差。
        excludes: ["形象进度（在「二、项目进展情况」一章写）"]
        facts_allowed: ["contract_price"]
      - code: gongzuo
        title: 四、本期主要咨询工作内容
        seq: 40
        rag_query: 本期 完成 计量审核 变更审核 签证审核 材料认价 核对 咨询意见 工作联系单
        gen_prompt: >
          【必备要素】本期已完成的咨询工作：计量审核、变更签证审核、材料认价、咨询意见、结算审核进展。

          【取材】本期咨询意见书、审核记录、工作联系单、会议纪要。

          【格式】按工作类别分条，每条写「事项＋结果＋依据[资料n]」。

          【缺失处理】只写【已确认事项】与资料载明的工作；某类工作资料里没有就不写该类，不自拟工作内容。
        excludes: ["变更签证的金额与办理状态（在「三、项目投资控制总体情况」一章写）"]
        claims: [{"key": "site_check", "text": "现场查勘"}]
      - code: zhongda
        title: 五、重大事件
        seq: 50
        rag_query: 重大 事件 停工 设计变更 索赔 争议 安全 质量 事故 会议 决定
        gen_prompt: >
          【必备要素】本期对投资有影响的重大事件（重大设计变更、停复工、索赔与争议、重要会议决定）。

          【取材】会议纪要、往来函件、监理月报。

          【格式】按时间顺序分条，每条一句话加出处[资料n]。

          【缺失处理】资料中没有本期重大事件的记录时写「【待补：本期重大事件】」，不自拟事件。
        excludes: ["存在问题及建议（在「六、存在问题及建议」一章写）"]
      - code: wenti
        title: 六、存在问题及建议
        seq: 60
        rag_query: 问题 风险 偏差 超概 争议 建议 预警
        gen_prompt: >
          【必备要素】本期投资控制中发现的问题（超概风险、变更签证积压、计价争议等）及对应建议。

          【取材】本期审核记录、会议纪要、往来函件；问题必须在资料里有依据。

          【格式】逐条写「问题＋依据[资料n]＋建议」，不超过 5 条。

          【缺失处理】资料里没有问题记录时写「【待补：本期存在的问题】」，不自拟问题。
        excludes: ["重大事件（在「五、重大事件」一章写）"]
      - code: jihua
        title: 七、下期工作计划
        seq: 70
        rag_query: 下期 下月 计划 安排 待办 需咨询
        gen_prompt: >
          【必备要素】下期需咨询的工作内容与时间安排。

          【取材】进度计划、会议纪要中的待办事项。

          【格式】分条列示，每条写「事项＋计划时间」。

          【缺失处理】资料没有的计划事项不写；整章为空时写「【待补：下期工作计划】」。

  # =====================================================================
  # 造价咨询成果报告 4 套(来源:咨询成果格式样本.doc 附样4-1~4-4 + 附件1/2/3)
  # 忠实照官方格式:封面/扉页/目录/正文(标准措辞)/附表。数据只用资料原文,无则留空。
  # =====================================================================
  - template_code: guzhi_chengguo
    name: 估算咨询成果报告
    enabled: true
    note: 来源 doc 附样4-1;封面+扉页+目录+正文(标准措辞)+附表
    note_user: 估算咨询成果报告：写封面、扉页、编制报告、基本情况、估算编制情况和附表；需要委托合同、立项或可研文件、设计方案、估算汇总表及计价文件；没有估算汇总表时，估算金额会是【待补】。
    sections:
      - code: fengmian
        title: 报告书封面
        seq: 10
        rag_query: 工程名称 建设单位 造价咨询企业 报告编号 编制日期
        gen_prompt: >
          【必备要素】①建设工程名称 ②报告书名称「工程造价咨询成果报告书（估算）」③委托单位 ④造价咨询企业名称 ⑤报告编号 ⑥编制日期。

          【取材】委托合同、立项或规划文件、资料中的项目名称；已成稿报告只参考体例，不沿用其名称、编号与日期。

          【格式】每个要素单独一行，写成「要素：内容」；本章只给文字要素，版式以模板库正式模板为准。

          【缺失处理】资料里没有的要素写「【待补：要素名】」；报告编号和编制日期不自拟。
      - code: feiye
        title: 报告书扉页
        seq: 20
        rag_query: 造价咨询企业 资质 法定代表人 审定人 审核人 编制人 执业章
        gen_prompt: >
          【必备要素】①造价咨询企业名称及资质等级 ②法定代表人 ③审定人 ④审核人 ⑤编制人。

          【取材】委托合同、企业资质证书、资料中的签章页。

          【格式】每项单独一行，写成「职责：姓名」；法定代表人后保留「（签名或盖章）」，审定人后保留「（盖执业章）」；
          不写正文段落。

          【缺失处理】人员姓名、资质等级资料里没有的写「【待补：要素名】」，不虚构姓名和证书编号。
      - code: mulu
        title: 报告书目录
        seq: 30
        rag_query: 估算 汇总表 单项工程估算表 其他费用
        gen_prompt: >
          【必备要素】①正文各章标题（按本报告实际章节）②附表名称（按【附件类别提示】，只列资料里实际存在的表）。

          【取材】本报告的章节标题；资料中实际存在的计价表格。

          【格式】分行列示，每行一个标题，不写页码。

          【缺失处理】资料里没有的附表不列。
        attachment_hints: ["估算汇总表", "单项工程估算表", "工程建设其他费用估算表"]
      - code: bianzhi
        title: 一、估算编制报告
        seq: 40
        rag_query: 估算 设计方案 规划总平面 编制依据 编制程序
        gen_prompt: >
          【必备要素】①受委托声明：受（委托单位）委托，对（建设工程名称）估算进行了编制 ②固定声明：建设单位负责提供真实、合法、完整的编制资料，编制方负责编制 ③编制依据：只列资料中实际出现的（设计方案图、规划总平面图、用地文件、会议记录等）④编制程序：写明实施了工程量计算（编制本身的工作）；其他程序只写【已确认事项】里的内容和资料中载明的内容。

          【取材】委托合同、设计方案、规划与用地文件、会议纪要。

          【格式】一至两段，不超过 300 字；依据与程序写成一句列举，不展开。

          【缺失处理】委托单位、工程名称资料里没有的写「【待补：要素名】」；没有已确认的其他程序，编制程序只写工程量计算。
        excludes: ["估算金额（在「三、工程估算编制情况」一章写）", "项目基本情况（在「二、基本情况」一章写）"]
        claims: [{"key": "site_check", "text": "现场查勘"}, {"key": "market_survey", "text": "市场调查"}]
      - code: jiben
        title: 二、基本情况
        seq: 50
        rag_query: 建设单位 立项 批复 建设内容 建设地点 规模
        gen_prompt: >
          【必备要素】①建设单位 ②立项批复文号 ③建设内容 ④建设规模 ⑤建设地点 ⑥资金来源。

          【取材】立项批复、可研或项目建议书、设计文件、项目汇总信息。

          【格式】一段，按上述顺序逐项写，不超过 300 字；数字逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的要素写「【待补：要素名】」，不推算规模。
        excludes: ["估算金额（在「三、工程估算编制情况」一章写）"]
      - code: guzhi_qingkuang
        title: 三、工程估算编制情况
        seq: 60
        rag_query: 估算造价 金额 汇总 建筑安装 其他费用
        gen_prompt: >
          【必备要素】①估算总造价（小写）②各项分列：建筑安装工程费、工程建设其他费用、预备费等资料汇总表里列出的项。

          【取材】估算汇总表及计价文件。

          【格式】先一句总述「该工程编制估算造价为（小写）元」，再按资料汇总表的费用项分条列示；每个金额逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的金额留空并写「【待补：金额项名】」，不计算合计或差额。
        excludes: ["编制依据（在「一、估算编制报告」一章写）"]
      - code: qita
        title: 四、其他需要说明的问题
        seq: 70
        rag_query: 说明 暂估 除外 特殊
        gen_prompt: >
          【必备要素】需要说明的问题：暂估内容、未包含（除外）内容、特殊约定。

          【取材】估算编制说明、会议纪要、委托方书面意见。

          【格式】分条列示，每条写「事项＋处理口径＋[资料n]」，不超过 8 条。

          【缺失处理】资料里没有需说明的事项时写「【待补：其他需要说明的问题】」，不自拟事项。
        excludes: ["估算金额（在「三、工程估算编制情况」一章写）"]
      - code: fubiao
        title: 附表
        seq: 80
        rag_query: 估算汇总表 单项工程估算表 工程建设其他费用估算表
        gen_prompt: >
          【必备要素】本报告附表的表名、列次与合计。

          【取材】计价软件导出的计价表格。

          【格式】每张表先写表名，再按资料里该表的列次列示，表名按【附件类别提示】归类；表内金额逐字照抄。

          【缺失处理】资料里没有的表不列；没有来源的单元格留空。
        attachment_hints: ["估算汇总表", "单项工程估算表", "工程建设其他费用估算表"]

  - template_code: gaisuan_chengguo
    name: 概算咨询成果报告
    enabled: true
    note: 来源 doc 附样4-2;封面+扉页+目录+正文(标准措辞)+附表
    note_user: 概算咨询成果报告：写封面、扉页、编制报告、基本情况、概算编制情况和附表；需要委托合同、立项批复或可研、设计文件、总概算表（概算汇总表）及计价文件；没有总概算表时，概算金额会是【待补】。
