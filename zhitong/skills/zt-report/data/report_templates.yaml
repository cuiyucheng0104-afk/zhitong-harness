          【缺失处理】人员姓名、资质等级资料里没有的写「【待补：要素名】」，不虚构姓名和证书编号。
      - code: mulu
        title: 报告书目录
        seq: 30
        rag_query: 概算 总概算表 单项工程综合概算 单位工程概算 工料汇总 其他费用
        gen_prompt: >
          【必备要素】①正文各章标题（按本报告实际章节）②附表名称（按【附件类别提示】，只列资料里实际存在的表）。

          【取材】本报告的章节标题；资料中实际存在的计价表格。

