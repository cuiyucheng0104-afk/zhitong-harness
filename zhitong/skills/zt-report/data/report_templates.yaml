        seq: 10
        rag_query: 受委托 招标控制价 编制 工程量清单 委托单位 编制原则
        gen_prompt: >
          【必备要素】①抬头：致（委托单位）②导语，按体例：「受贵单位委托，我公司承担（项目名称）工程量清单及招标控制价编制工作……现将本项目概况、招标范围、编制依据、取费标准、材料价格、其他项目费、特殊事项说明及最终招标控制价成果汇报如下」。

          【取材】委托合同、招标文件、项目汇总信息。

          【格式】抬头一行加导语一段，导语不超过 200 字。

