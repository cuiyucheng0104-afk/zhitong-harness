    note_user: 招标控制价编制报告（房建）：写项目概况、招标范围、编制依据、质量工期与材料要求、取费与材料价格、其他项目费、特殊事项和招标控制价成果；需要委托合同、招标文件、设计说明、编制说明、取费表和招标控制价汇总表；没有汇总表时，控制价金额会是【待补】。
