          【取材】编制说明、图纸会审纪要、答疑回复、招标文件。

          【格式】（一）（二）（三）分块，每块编号分条，每条写「事项＋计价口径＋[资料n]」。

          【缺失处理】无资料支撑的事项不写；某块整块没有资料时写「【待补：要素名】」。
