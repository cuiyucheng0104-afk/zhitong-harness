          【取材】概算批复、设计说明、勘察报告、项目汇总信息。

          【格式】（一）（二）（三）三个小节，每节一段；数字逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的要素写「【待补：要素名】」，不推算面积与规模。
        excludes: ["招标范围（在「二、招标范围」一章写）", "招标控制价金额（在「八、招标控制价最终成果」一章写）"]
