  - template_code: gaisuan_shenhe_shizheng
    name: 概算审核报告(市政)
    enabled: true
    note: 来源 doc 附件6-2 市政变体(市政工程概算审核报告);导语+六章+落款,与房建版同构;项目概况增桩号/审核范围/资金来源分条,对比分析按道路/桥梁/排水等市政分部逐项;园林概算审核样本内无
    note_user: 概算审核报告（市政）：写项目概况、审核依据、审核情况、审核结果和与送审概算的对比分析；需要委托合同、送审概算及其编制说明、可研批复、投资概算评审及对比表（或审核汇总表）、审核记录；没有对比表时，审核金额和核减原因会是【待补】。
    sections:
      - code: daoyu
        title: 报告抬头与导语
        seq: 10
        rag_query: 受委托 概算 审核 市政工程 概算定额 合规性 审核结果
        gen_prompt: >
          【必备要素】①抬头：致（委托方名称）②说明受委托对（项目名称）市政工程的概算进行审核 ③审核依据：只写资料中实际出现的（建设单位、设计单位提供的资料，国家与地方造价文件等）④固定声明：审核单位对审核报告的合规性及结果与审核依据的一致性负责 ⑤过渡句：引出审核结果。

          【取材】委托合同、送审概算及其编制说明、项目汇总信息。

          【格式】抬头一行加导语一段，导语不超过 250 字。

          【缺失处理】委托方名称、项目名称资料里没有的写「【待补：要素名】」。
        excludes: ["审核金额与审核结论（在「审核结果」一章写）", "项目概况（在「项目概况」一章写）"]
      - code: gaikuang
        title: 一、项目概况
        seq: 20
        rag_query: 市政 项目概况 道路 桩号 红线宽度 桥梁 可行性研究报告 批复 估算总投资 审核范围 资金来源
        gen_prompt: >
          【必备要素】①工程基本情况：道路起终点桩号、全长、红线宽度、桥梁，可研批复时间与批复估算总投资分列 ②审核范围：道路、桥梁、排水、河道护岸、配套附属、市政安装、总图工程，及不包含的内容 ③资金来源 ④项目实施单位：建设、初步设计、概算编制 ⑤其他特殊问题的说明。

          【取材】可研批复、初步设计说明、送审概算编制说明、项目汇总信息。

          【格式】按上述五项编号分条；数字逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的数字留空并写「【待补：要素名】」，不推算。
        excludes: ["审核金额与审核结论（在「四、审核结果」一章写）"]
      - code: yiju
        title: 二、审核依据
        seq: 30
        rag_query: 审核依据 可行性研究报告 扩初 初步设计概算 市政工程概算定额 造价信息 同类市政道路桥梁
        gen_prompt: >
          【必备要素】依据文件逐条列示：经批准的可研报告、扩初文本和初步设计概算、省计价规则与市政工程概算定额及其他费用定额、税费调整文件、造价信息期刊、已建同类市政道路桥梁及配套工程造价基础资料。

          【取材】送审概算及其编制说明、资料中的文件目录、委托合同。

          【格式】编号分条，每条一个文件，写全称与版本号（资料里有的才写）。

          【缺失处理】只列资料中实际出现的依据；资料没有的不列，不虚构文号与版本。
      - code: qingkuang
        title: 三、审核情况说明
        seq: 40
        rag_query: 概算 取费 市政土建 市政安装 综合费率 扩大系数 税金 土石方运距 措施费 其他费用 预备费
        gen_prompt: >
          【必备要素】①概算费用取定：市政土建按道路排水、桥梁、隧道分列单价与总价综合费率，市政安装费率 ②工程扩大系数与税金取定 ③人工及材料价格 ④土石方运距调整 ⑤施工措施费用 ⑥材料调价规则 ⑦工程建设其他费用逐项核定说明（管理费、代建费、建设用地费、设计费、配套费、预备费、贷款利息等）。

          【取材】审核记录、取费表、询价记录、造价信息期刊、核对纪要。

          【格式】按上述顺序编号分条，每条写「审核口径＋结论＋[资料n]」；费率与金额逐字照抄。

          【缺失处理】费率与金额资料里没有的留空并写「【待补：要素名】」，不套用标准费率。
        excludes: ["审核金额与审核结论（在「四、审核结果」一章写）"]
      - code: jieguo
        title: 四、审核结果
        seq: 50
        rag_query: 审核结果 概算总投资 工程费用 其他费用 建设用地费 预备费 送审 核减 可研批复 对比
        gen_prompt: >
          【必备要素】①经审核概算总投资（工程费用、含建设用地费的其他费用、预备费分列）②不包含的内容 ③与可研批复估算总投资对比的增减 ④与送审概算总投资对比的增减 ⑤指明详见投资概算评审及对比表。

          【取材】投资概算评审及对比表、审核汇总表、可研批复。

          【格式】一段总述加分条；每个金额（含增减额）逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的金额留空并写「【待补：金额项名】」，不计算增减。
        excludes: ["核增、核减原因（在「五、审核结果与送审概算对比分析」一章写）"]
        facts_allowed: ["submitted_total", "approved_total", "reduction", "increase", "net_reduction"]
      - code: duibi
        title: 五、审核结果与送审概算对比分析
        seq: 60
        rag_query: 对比分析 核增 核减 道路工程 桥梁 排水 河道护岸 管廊 建设用地费 其他费用 预备费
        gen_prompt: >
          【必备要素】①工程费用：道路、桥梁、排水、河道护岸、隧道、综合管廊、人行过街、配套辅助、涉铁、电力沟体、建构筑物保护等分部逐条列核增、核减及原因 ②建设用地费 ③工程建设其他费用 ④预备费 ⑤工程建设专项费用。

          【取材】投资概算评审及对比表、审核记录、往来函件。

          【格式】（一）至（五）分块，每条写「分部或费用项＋送审＋审核＋核增或核减＋原因＋[资料n]」；
          金额逐字照抄。

          【缺失处理】原因资料里没有载明的写「【待补：核减原因】」，不虚构核减理由；金额资料里没有的留空。
        excludes: ["审核结论总述（在「四、审核结果」一章写）"]
        facts_allowed: ["submitted_total", "approved_total", "reduction", "increase", "net_reduction"]
      - code: fujian
        title: 六、附件
