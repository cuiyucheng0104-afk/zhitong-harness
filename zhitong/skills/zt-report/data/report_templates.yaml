          【取材】委托合同、立项或规划文件、资料中的项目名称；已成稿报告只参考体例，不沿用其名称、编号与日期。

          【格式】每个要素单独一行，写成「要素：内容」；本章只给文字要素，版式以模板库正式模板为准。

          【缺失处理】资料里没有的要素写「【待补：要素名】」；报告编号和编制日期不自拟。
      - code: feiye
        title: 报告书扉页
        seq: 20
        rag_query: 造价咨询企业 资质 法定代表人 审定人 审核人 编制人
        gen_prompt: >
          【必备要素】①造价咨询企业名称及资质等级 ②法定代表人 ③审定人 ④审核人 ⑤编制人。

          【取材】委托合同、企业资质证书、资料中的签章页。

          【格式】每项单独一行，写成「职责：姓名」；法定代表人后保留「（签名或盖章）」，审定人后保留「（盖执业章）」；
