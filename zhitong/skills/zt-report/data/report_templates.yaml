        rag_query: 暂列金额 暂估价 计日工 总承包服务费 费率
        gen_prompt: >
          【必备要素】暂列金额、暂估价、计日工、施工总承包服务费的计列口径与金额。

          【取材】招标文件、其他项目清单与计价表、编制说明。

          【格式】按上述四项分条，每项写口径与金额；金额与费率逐字照抄并注明[资料n]。

          【缺失处理】资料载明未发生的项写「无」；资料没有载明的写「【待补：要素名】」。
      - code: teshu
        title: 七、编制特殊事项及综合说明
