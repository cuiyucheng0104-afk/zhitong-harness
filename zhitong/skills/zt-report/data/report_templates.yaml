          【格式】先一句总述「该工程结算造价为（小写）元」，再按送审、审定、核增、核减分条列示；每个金额逐字照抄并注明[资料n]。

          【缺失处理】资料里没有的金额留空并写「【待补：金额项名】」，不计算差额。
        excludes: ["编制依据（在「一、结算编制报告」一章写）"]
        facts_allowed: ["submitted_total", "approved_total", "reduction", "increase", "net_reduction"]
      - code: qita
        title: 四、其他需要说明的问题
        seq: 70
        rag_query: 说明 争议 暂估 除外 特殊
        gen_prompt: >
          【必备要素】需要说明的问题：争议事项、暂估内容、未包含（除外）内容、特殊约定。

          【取材】结算编制说明、会议纪要、往来函件、委托方书面意见。

          【格式】分条列示，每条写「事项＋处理口径＋[资料n]」，不超过 8 条。

          【缺失处理】资料里没有需说明的事项时写「【待补：其他需要说明的问题】」，不自拟事项。
        excludes: ["结算金额（在「三、工程结算造价编制情况」一章写）"]
      - code: fubiao
        title: 附表
        seq: 80
        rag_query: 结算汇总表 单位工程结算书 变更签证费用汇总 工料数量汇总表
        gen_prompt: >
          【必备要素】本报告附表的表名、列次与合计。

          【取材】计价软件导出的计价表格。

          【格式】每张表先写表名，再按资料里该表的列次列示，表名按【附件类别提示】归类；表内金额逐字照抄。

          【缺失处理】资料里没有的表不列；没有来源的单元格留空。
        attachment_hints: ["结算汇总表", "单位工程结算书", "变更签证费用汇总", "工料数量汇总表"]

