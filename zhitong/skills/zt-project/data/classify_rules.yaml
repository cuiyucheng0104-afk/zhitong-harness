  - { kind: whitelist, match: all_of, pattern: 审核+报告, doc_category: 审核报告, cost_stage: 审定, exclude_any: [目录, 封面, 扉页], priority: 4, note: xlsx 成果;#210 裁定审定;WS13-P01 整体后移 3;WS13-P03 目录页/封面/扉页不冒充报告 }
