  - { kind: whitelist, match: all_of, pattern: 市政+审核, doc_category: 市政审核表, cost_stage: 审定, priority: 8, note: 特指胜归档词「市政」 }
  - { kind: whitelist, match: all_of, pattern: 绿化+审核, doc_category: 绿化审核表, cost_stage: 审定, priority: 9, note: 特指胜归档词「绿化」 }
  - { kind: whitelist, match: all_of, pattern: 工程量+清单, doc_category: 工程量清单, cost_stage: 招标控制价, priority: 10, veto_ancestors: [进度款, 产值, 付款, 支付, 结算, 审核终稿, 套价], note: xlsx;WS13-P01 进度款/结算目录下的清单不是招标清单 }
  - { kind: whitelist, match: all_of, pattern: 招标控制价+封面, doc_category: 招标控制价, cost_stage: 招标控制价, priority: 11, note: 特指胜白名单「封面」;控制价封面属控制价成果(PM 拍板 2026-07-21) }

