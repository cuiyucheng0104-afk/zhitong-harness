#      + 文件名分类规则库-草稿-给客户核对-20260702.xlsx(31 条 L1 规则并入)
# status=confirmed(D-035 2026-07-06:李总核对包回收,附件2 规则库 29/31 √ 转正;
#   电气+审核→安装对比表 已符合「电气并入安装」口径,无独立"电气审核"类目需删);改规则=改数据行。
#
# 引擎匹配顺序(app/engine/classify_rules.py ClassifyEngine.classify_one,命中即停;
#   WS13-P01 issue #720 重排,逐行对照见 docs/附录B-分类口径变更逐行对照-WS13.md):
#   ①  noise(系统噪音,不自定档→needs_manual)
#   ②  系统生成物(INDEX.md / .ocr.txt 旁车)—— WS13-P03(#759),引擎代码 system_artifact_kind 判,本文件无规则行
#   ③  blacklist(跳过)—— 同时命中 upgrade_whitelist 则白胜(修正#7);
#       含疑词(classify.blacklist_doubt_words)又无升档词 → skip/0.6/待复核
#   ④  archive_ext(扩展名;二进制计价 needs_export→pending_export,类目按祖先目录补)
#   ⑤  whitelist all_of 复合规则
#   ⑥  whitelist 特指(tier 缺省 = specific)            ← 先于归档词:「施工图预算」不再被「施工图」截走
#   ⑦  archive_keyword 带类目的归档词
#   ⑧  设计文档 / CAD 细分
#   ⑨  直属父目录 = 专业词(#C4)
#   ⑩  ancestor_context 祖先目录继承(由近及远,needs_manual)
#   ⑪  whitelist 裸词(tier: bare;0.65,needs_manual)
#   ⑫  只命中无类目专业词 → archive/None/0.0/needs_manual(不再终止判定)
#   ⑬  默认档 = classify.default_disposition(修正#9,种子 skip)
#
# 可选字段(WS13-P01/P09,不写保持旧语义):
#   tier: bare            裸词,出厂 0.65 + needs_manual,排在祖先继承之后
#   exclude_any: [..]     文件名含其中任一词时不命中
#   require_any: [..]     文件名或任一祖先目录至少含其一时才命中
#   veto_ancestors: [..]  任一祖先目录含其中任一词时不命中
#   stage_policy: context 阶段按语境:文件名期次→施工过程,否则取最近带阶段的祖先目录,找不到为 null
#
# priority:同 kind 内小号先匹配;复合词必须小号(修正#3:招标控制价<控制价<招标;结算审定<结算)。
# cost_stage 取 6 枚举(估算/概算/招标控制价/施工过程/结算/审定,需求表 §7.1);
#   细粒度阶段标签(进度款/变更签证等)保留在 note 供追溯。
# 已知张力(待客户核对):监理*/施工管理类在造价套=跳过,但城建档案套按 3-A 应收——
#   Phase1 规则全局生效,套型级 overlay 列为开放问题(见设计说明 §七)。

rules:
  # ============ Step0 系统噪音(不自定档) ============
  - { kind: noise, match: contains, pattern: 未命名, priority: 10, note: 目录场景导入管道递归下钻重判 }
  - { kind: noise, match: contains, pattern: 项目资料, priority: 11 }
  - { kind: noise, match: contains, pattern: 全部项目, priority: 12 }
  - { kind: noise, match: regex, pattern: '^\d+#?$', priority: 20, note: 标段号 }
  - { kind: noise, match: regex, pattern: '^[A-Z]?\d+标段?$', priority: 21, note: 标段号 }

  # ============ Step1 跳过黑名单 ============
  # 修正#1(P0):删裸词「报审表」,换精确非造价词(防误杀 变更费用报审/计量报审/索赔报审)
  - { kind: blacklist, match: contains, pattern: 开工报审, priority: 10, note: 修正#1 替代裸词报审表 }
  - { kind: blacklist, match: contains, pattern: 复工报审, priority: 11, note: 修正#1 }
  - { kind: blacklist, match: contains, pattern: 技术文件报审, priority: 12, note: 修正#1 }
  - { kind: blacklist, match: contains, pattern: 进度计划报审, priority: 13, note: 修正#1 }
  - { kind: blacklist, match: contains, pattern: 开工报告, priority: 14, note: 修正#1 }
  # 修正#8(P2):删裸词「承诺」,换精确词(防误杀 报价承诺函/让利承诺)
  - { kind: blacklist, match: contains, pattern: 质量承诺, priority: 20, note: 修正#8 替代裸词承诺 }
  - { kind: blacklist, match: contains, pattern: 安全承诺, priority: 21, note: 修正#8 }
  - { kind: blacklist, match: contains, pattern: 资质承诺, priority: 22, note: 修正#8 }
  # 施工技术/管理(非造价)
  - { kind: blacklist, match: contains, pattern: 施工组织设计, priority: 30, note: 修正#6 父目录∈控制价/投标/招标时引擎降档 archive+needs_section_extract(措施费) }
  - { kind: blacklist, match: contains, pattern: 施工方案, priority: 31, note: 修正#6 同上 }
  - { kind: blacklist, match: contains, pattern: 施工日志, priority: 32 }
  - { kind: blacklist, match: contains, pattern: 施工现场记录, priority: 33 }
  - { kind: blacklist, match: contains, pattern: 分包, priority: 34 }
  - { kind: blacklist, match: contains, pattern: 技术交底, priority: 35 }
  - { kind: blacklist, match: contains, pattern: 复试报告, priority: 36 }
  - { kind: blacklist, match: contains, pattern: 见证, priority: 37 }
  - { kind: blacklist, match: contains, pattern: 检测, priority: 38 }
  - { kind: blacklist, match: contains, pattern: 试验, priority: 39 }
  - { kind: blacklist, match: contains, pattern: 沉降观测, priority: 40 }
  - { kind: blacklist, match: contains, pattern: 开盘鉴定, priority: 41 }
  - { kind: blacklist, match: contains, pattern: 旁站, priority: 42 }
  - { kind: blacklist, match: contains, pattern: 监理规划, priority: 43, note: 监理决算不含此词,不受影响;城建档案套张力见文件头 }
