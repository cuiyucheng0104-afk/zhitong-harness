# 迁移记录：原文件 /home/user/zhitong-cost-ai/engine-service/app/engine/data/doc_category_map.yaml，逐字未改。
# 签核状态沿用原文件：D64 条目「按默认方案处理，随附录 B 送签」，客户未确认，整体按「待签核」处理。
#
# 分类器类目 → 清单口径类目（WS13-P14，issue #720；D64 按默认方案处理，随附录 B 送签）
#
# 为什么要有这张表：分类器按文件名能产出 80 个左右的类目（其中 CAD/设计文档细分子类 20 多种），
# 而资料清单（后端/sql/tenant-init/tenant-seed-template.sql §6 cfg_checklist_item）只有 20 项（D63 加了 42020），
# audit_check 原来只做精确比对 ——「建筑施工图.pdf → 建筑图纸」「结算审定书 → 结算审定稿」
# 这类判得没错的文件，一个都命不中 42009 施工图纸 / 42017 结算审定单。
#
# 用法：app/engine/category_vocab.py。audit_check 比对前把文件类目与清单类目/别名都过一遍
# canonical()。CI 闸 tests/test_category_vocabulary_gate.py 保证：
#   - map 的每个目标都是种子里真实存在的清单类目；
#   - 分类器每个类目都有去处 —— 要么映射到清单（含同名直达），要么登记在 not_audited；
#   - 种子里每个清单类目和别名都能由分类器产出。
#
# 回滚：客户否决哪一条，就删哪一行（被删的类目会被 CI 闸要求登记进 not_audited 或另映射）。

map:
  # —— 全部 CAD 与设计文档细分子类 → 42009 施工图（classify_rules.py _CAD_SUBTYPE_DEFAULT）——
  设计图纸: 施工图            # CAD 默认类目（cad_drawing_default_category）
  设计说明图: 施工图
  建筑图纸: 施工图
  建筑平面图: 施工图
  建筑立面图: 施工图
  建筑剖面图: 施工图
  结构图纸: 施工图
  钢结构图纸: 施工图
  给排水图纸: 施工图
  总平面图: 施工图
  暖通图纸: 施工图
  智能化图纸: 施工图
  消防图纸: 施工图
  幕墙图纸: 施工图
  精装修图纸: 施工图
  景观图纸: 施工图
  市政图纸: 施工图
  电气图纸: 施工图
  # —— 其余 ——
  扩初设计图: 初步设计图      # 42003
  投标文件: 投标报价书        # 42006（D64 默认：投标文件映射到投标报价书）
  结算审定书: 审定单          # 42017
  结算审定稿: 审定单          # 42017
  审计/复审稿: 审核报告       # 42015（D64 默认）
  结算送审稿: 结算送审书      # 42020（D63，WS13-B #759 入种子）；「结算送审书」同名直达，不用写
  # 「招标文件」不在此表：它是种子 42004 招标控制价的现有别名（分类器能产出，按 P14 保留），
  # 经别名直达 42004。是否删掉这个别名随附录 B 由客户定。

# 不参与核查的类目（逐条写理由）。这些类目照常标注、照常入 RAG，只是齐套核查不拿它们当证据。
not_audited:
  目录: 成果件的目录页，不是资料本身
  封面: 成果件的封面页，不是资料本身
  扉页: 成果件的扉页，不是资料本身
  工程概况: 辅助元数据
  前期现场照片: 清单无此项
  中标通知书: 清单无此项
  答疑补遗: D64 新增类目，默认不参与核查
  竣工验收报告: D64 新增类目，默认不参与核查
  咨询服务合同: D64 新增类目，默认不参与核查（招标代理/造价咨询等服务合同，不是施工合同）
  开竣工记录: 清单无此项
  隐蔽记录: 清单无此项
  施工许可: 清单无此项
  地质勘察报告: 清单无此项
  监理合同: 清单无此项（不是施工合同）
  勘察合同: 清单无此项（不是施工合同）
  设计合同: 清单无此项（不是施工合同）
  招标图纸: D64 默认：招标图纸不参与核查
  # —— 以下不在 spec 列举范围，按「保持现状」登记：它们此前与任何清单项都精确比对不上，
  #    登记为 not_audited 不改变任何核查结果；要不要并入某个清单项，随附录 B 由客户定 ——
  结算价文件: 清单无此项（结算定案表已由「定案表」规则直判审定单）
  竣工决算书: 清单无此项
  施工图预算: 预算书不是施工图纸，不得命中 42009（D64：阶段维持概算）
  设计概算书: 清单无此项
  投资估算书: 清单无此项
  造价综合文件: 泛称，不对应具体清单项
  工程量计算书: 清单无此项
  费用索赔: 清单无此项；是否并入 42011 变更签证费用待客户定
  会议纪要·联系函: 清单无此项
  土建对比表: 审核底稿，清单无此项
  安装对比表: 审核底稿，清单无此项
  市政审核表: 审核底稿，清单无此项
  绿化审核表: 审核底稿，清单无此项
  概算预算对比: 清单无此项
  价款对比分析: 清单无此项
  指标对比: 清单无此项；是否并入 42019 造价指标待客户定
  结算指标: 清单无此项；是否并入 42019 造价指标待客户定
  预算指标: 清单无此项；是否并入 42019 造价指标待客户定
