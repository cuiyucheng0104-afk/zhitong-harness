# 资料清单（齐套核查 / 资料盘点用）
#
# 来源：/home/user/zhitong-cost-ai/后端/sql/tenant-init/tenant-seed-template.sql 第 6 节
#       cfg_checklist_stage（5 行）与 cfg_checklist_item（36 行：通用 ALL 20 行、结算审核 20002 12 行、
#       招标控制价编制 20003 4 行）。逐列照搬，只把 requirement_level 1/2/3 译成 required/important/optional
#       （旧系统 AuditCheckInputBuilder 同口径），把 aliases 的 JSON 字符串译成列表。
#
# 签核状态：本文件整体【待签核】。逐条见 signoff 字段：
#   seed         旧系统出厂种子（签核状态在旧仓里没有记录，按待签核对待）
#   provisional  业务方口头拍板，注明「暂定、后面可改」（见各条 note）
#   unconfirmed  旧系统实施整改时给的默认值，客户未确认
#   没有任何一条被标成「客户已确认」；改成已确认之前不得改动本字段。
#
# 用法（zt.inventory.checklist）：
#   - 阶段口径累计：选「X」= X 及其之前各阶段（sort 不大于 X）的清单项；不选阶段 = 全部阶段，须用户显式要求。
#   - 咨询类型：有专属清单（20002、20003）就用专属的，没有（20001 全过程）才退回 ALL。
#   - requirement_level：required 进分母，important 缺了只提示，optional 不报。
#   - doc_category / aliases 是清单口径类目；分类器类目经 doc_category_map.yaml 折算后再比对。
#
# 改本文件 = 改核查口径。保持 item_id 稳定；增删条目要同步 tests/inventory 的条目数断言。

consulting_types:
  - {"code": "20001", "name": "全过程造价咨询"}
  - {"code": "20002", "name": "结算审核"}
  - {"code": "20003", "name": "招标控制价编制"}

