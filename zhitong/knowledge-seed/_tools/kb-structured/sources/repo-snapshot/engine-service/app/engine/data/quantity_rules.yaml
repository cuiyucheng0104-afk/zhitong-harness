# 工程量清单生成（quantity/generate）的确定性规则（WS11，issue #763）。
#
# 这些规则只做两件事：把输入**切干净、分清去向**（片段识别 / 专业范围 / 标段排除 / 层的角色），
# 以及对 LLM 选的编码做**语义一致性复核**。它们从不替模型改码 —— 复核不过的条目一律降为
# 「待核」，建议栏写规则期望的码表名称（决策 D52，铁律 3）。
#
# 改这份文件 = 改产出口径：每条规则都要在 tests/test_quantity_rules.py 里配正例与反例。

# ----------------------------------------------------------------------------- 专业范围（QTY-07）
# 文件级：building_share < scope.min_building_share 且非房建词命中 ≥ scope.min_foreign_hits → 越界。
# 计数口径是 str.count 逐词累加（同一个词重复出现按次数算）。
scope:
  min_building_share: 0.3
  min_foreign_hits: 20
scope_domains:
  building:
    [楼地面, 地面, 楼面, 屋面, 墙面, 内墙, 外墙, 顶棚, 天棚, 吊顶, 踢脚, 墙裙, 门窗, 砌体, 砌块, 抹灰,
     涂料, 乳胶漆, 腻子, 防水, 保温, 找平, 找坡, 面砖, 地砖, 瓷砖, 石材, 卫生间, 楼梯, 女儿墙, 散水,
     台阶, 坡道, 地下室, 车库, 装修, 装饰, 建筑, 住宅, 幕墙, 栏杆, 雨篷, 阳台, 窗台, 防火门, 室内,
     细石混凝土, 水泥砂浆, 素水泥浆, 界面剂, 自流平, 龙骨, 石膏板, 挤塑, 岩棉]
  municipal:
    [道路, 路基, 路面, 沥青, 底基层, 水稳, 水泥稳定碎石, 级配碎石, 车行道, 人行道, 非机动车道, 侧石,
     平石, 路缘石, 桥梁, 桥台, 桥墩, 盖梁, 箱梁, 空心板梁, 伸缩缝, 防撞护栏, 边沟, 截水沟, 涵洞,
     箱涵, 管涵, 雨水口, 压实度, 弯沉, 标线, 交通标志, 路灯, 桩号, JTG, CJJ, 公路, 匝道, 路堤,
     路堑, 清表, 路床, 透层, 粘层, 封层]
  installation:
    [暖通, 通风, 空调, 风管, 风机, 风口, 风阀, 排烟, 送风, 回风, 新风, 排风, 冷水机组, 冷却塔,
     水泵, 阀门, 管径, 消火栓, 喷淋, 喷头, 报警阀, 火灾报警, 配电箱, 配电柜, 桥架, 电缆, 电线,
     线槽, 照明, 灯具, 开关, 插座, 弱电, 综合布线, 监控, 摄像机, 门禁, 光纤, 接地, 防雷, 母线,
     变压器, 电气, 风机盘管, 散热器, 支吊架, 镀锌钢管, 静压箱, 多联机, 冷媒, 冷凝水, 智能化]
domain_names:
  building: 房屋建筑与装饰
  municipal: 市政/道路桥梁
  installation: 安装（暖通/给排水/电气/弱电）

# ----------------------------------------------------------------------------- 做法片段词表（QTY-03）
# 片段判定（quantity_segment 使用）：
#   · 做法表的「做法」列里、做法块内的编号层：命中材料词或厚度即为做法层；
#   · 块外的散行：须同时命中（厚度或强度/配比）与材料词。
practice_lexicon:
  thickness:
    - '(?<![\d.])\d+(?:\.\d+)?\s*(?:mm|MM|毫米)?\s*厚'
    - '厚\s*度?\s*[:：]?\s*\d+(?:\.\d+)?\s*(?:mm|MM|毫米)?'
    - '(?<![\d.])\d+(?:\.\d+)?\s*(?:mm|MM|毫米)(?![²2])'
  strength:
    - '(?<![A-Za-z])C\d{2}(?!\d)'
    - '(?<![A-Za-z])M[Uu]?\d+(?:\.\d+)?(?!\d)'
    - '1\s*[:：]\s*\d+(?:\.\d+)?'
  materials:
    [水泥砂浆, 砂浆, 混凝土, 细石, 素水泥浆, 水泥浆, 界面剂, 防水涂料, 涂膜, 卷材, 油毡, 沥青, 聚氨酯,
     丙纶, SBS, 渗透结晶, 保温, 挤塑, 聚苯, XPS, EPS, 岩棉, 玻化微珠, 珍珠岩, 陶粒, 炉渣, 碎石, 卵石,
     灰土, 素土, 腻子, 乳胶漆, 涂料, 真石漆, 面砖, 地砖, 瓷砖, 釉面砖, 石材, 花岗岩, 大理石, 水磨石,
     自流平, 环氧, 地坪漆, 龙骨, 石膏板, 硅钙板, 矿棉板, 铝扣板, 铝板网, 钢丝网, 网格布, 隔汽, 隔离层,
     找坡, 找平, 保护层, 结合层, 垫层, 面层, 木地板, 地毯, 吊杆, 踢脚, 防水, 隔热, 砌块, 砖,
     抹灰, 满刮, 防霉, 抗裂,
     # 漆类（WS29-k2，E31）：外露铁件「氟碳金属面漆 / 氟碳金属底漆 / 刷专用防锈漆」原来一个词都不中，
     # 做法块里整组落成 other，哪一页都查不到
     面漆, 底漆, 防锈漆, 氟碳漆, 油漆, 清漆]

# ----------------------------------------------------------------------------- 层的角色（QTY-09）
# standalone：按规范单列；aux：并入主项的特征描述；base：结构基体，不出项。
# 角色闸：命中 standalone 词却被模型标成 aux/base → 待核；只命中 aux 词 → 强制辅层；
#         只命中 base 词 → 强制基层。
granularity:
  standalone: [面层, 防水, 保温, 隔热, 找坡, 找平, 刚性层, 保护层, 隔离层, 垫层, 踢脚, 吊顶, 滤水层]
  aux: [结合层, 粘结层, 界面剂, 素水泥浆, 水泥浆一道, 打底, 底漆, 中涂, 腻子, 龙骨, 压条, 铝板网,
        钢丝网, 网格布, 吊杆, 嵌缝, 封闭剂]
  base: [结构板, 结构层, 结构楼板, 现浇楼板, 钢筋混凝土楼板, 钢筋混凝土屋面板, 现浇钢筋混凝土板,
         基层墙体, 原结构, 素土夯实, 原土夯实]

# ----------------------------------------------------------------------------- 语义一致性闸（QTY-02）
# 字段：
#   any / text_any / ctx_any：词表，分别在「原文+上下文」/「原文」/「上下文（类别、部位、做法名、标题）」
#       里至少命中一个；text_none / ctx_none / any_none：一个都不许命中。多个条件是「且」。
#   expect：编码（去掉浙江补充 Z 前缀后）必须以其中之一开头；forbid：不许以其中任何一个开头。
#   suggest：只用于建议栏（「规则期望：…」写哪几个码表名称），不参与判定。forbid 型规则不写它时建议栏只有 message。
# 覆盖 QA 错码证据：踢脚→墙面抹灰、顶棚涂料→天棚抹灰、底板卷材→屋面卷材、楼地面涂膜/渗透结晶、
# 挡土墙、细石混凝土面层与屋面找平误用 011101001。
consistency_rules:
  - id: skirting
    any: [踢脚]
    expect: ['011105', '011109002']
    message: 踢脚按 0111-05「踢脚线」列项，计量单位 m
  - id: ceiling_paint
    ctx_any: [顶棚, 天棚]
    text_any: [涂料, 乳胶漆, 喷涂, 涂刷, 刷漆, 真石漆]
    text_none: [腻子, 防水, 抹灰, 防火]
    expect: ['011404002', '011403001']
    message: 顶棚刷涂料按 011404002「天棚喷刷涂料」列项，不是天棚抹灰
  - id: floor_coating_waterproof
    ctx_any: [楼地面, 地面, 楼面, 卫生间, 厨房, 淋浴]
    text_any: [涂膜, 防水涂料, 聚氨酯, JS, 渗透结晶]
    ctx_none: [屋面, 底板, 墙面, 内墙, 外墙, 墙裙]
    expect: ['010904002', '010904003']
    message: 楼地面涂膜 / 渗透结晶防水按 Z010904002「楼(地)面涂膜防水」列项
  - id: slab_membrane
    any: [底板]
    text_any: [卷材]
    expect: ['010905001']
    message: 基础底板卷材防水按 Z010905001「基础卷材防水」列项，不是屋面卷材
  - id: retaining_wall
    any: [挡土墙]
    expect: ['010502026', '010403004']
    message: 挡土墙按 010502026（混凝土）或 010403004（石）列项
  - id: fine_concrete_not_cement_floor
    text_any: [细石混凝土]
    forbid: ['011101001']
    message: 细石混凝土层不是「水泥砂浆楼地面」（011101001）；明确楼地面面层时参考 011101002，明确找平层时参考 Z011101007，屋面刚性层才参考 Z010902004；保护层需按实际部位和功能人工确认
  # R4F-d：铁律 3，只判不改。约束当前层，不借同一做法的另一层材料替保护层背书。
  - id: floor_fine_concrete_not_roof
    category_any: [楼地面]
    ctx_any: [楼地面, 地面, 楼面]
    ctx_none: [屋面]
    text_any: [细石混凝土]
    forbid: ['010902004']
    message: 楼地面细石混凝土层不能用 Z010902004「屋面刚性层」；只有原文明示面层才参考 011101002「细石混凝土楼地面」（m²），明示找平层才参考 Z011101007「细石混凝土找平层」（m²）；保护层不能仅凭名称定码，请人工确认
  - id: floor_paint_not_wall
    category_any: [楼地面]
    ctx_any: [楼地面, 地面, 楼面]
    ctx_none: [墙面, 内墙, 外墙, 墙裙, 顶棚, 天棚, 屋面]
    text_any: [地坪漆, 涂料, 油漆, 环氧]
    forbid: ['011404001']
    message: 楼地面涂层不能用 011404001「墙面喷刷涂料」；普通地坪漆没有可直接断定的专用码，只有基层和施工语义吻合才参考 011403001「抹灰面油漆」（m²），明确防腐性能才考虑 011003003「防腐涂料」（m²）；均为条件候选，请人工确认
  - id: block_protection_not_insulation
    ctx_any: [墙, 砌体]
    text_any: [砌块, 砖]
    text_affirmative_none: [保温, 隔热, 岩棉, 玻璃棉, 挤塑, 聚苯, XPS, EPS, 玻化微珠, 珍珠岩]
    forbid: ['011001003']
    message: 当前砌块或砖层缺少肯定保温材料证据，或本层保温隔热功能被明确否定/与材料描述冲突，不能直接用 011001003「保温隔热墙面」；不能借同做法保温主层的材料定保护层编码。只有明确独立砌块墙时参考 010402001「砌块墙」（m³），特殊保护构造请人工确认
  - id: roof_leveling_not_floor
    ctx_any: [屋面]
    text_any: [找平]
    forbid: ['011101001']
    message: 屋面找平层按 Z011101006 / Z011101007 找平层列项，不是「水泥砂浆楼地面」
  - id: roof_membrane
    ctx_any: [屋面]
    text_any: [卷材]
    text_none: [隔离]
    expect: ['010902001']
    message: 屋面卷材防水按 Z010902001 列项
  - id: roof_coating
    ctx_any: [屋面]
    text_any: [涂膜, 防水涂料, 聚氨酯]
    expect: ['010902002', '010902009']
    message: 屋面涂膜防水按 Z010902002 列项（天沟檐沟 010902009）
  - id: wall_waterproof_not_roof
    ctx_any: [墙面, 内墙, 外墙]
    text_any: [防水]
    ctx_none: [屋面]
    forbid: ['010902']
    message: 墙面防水按 0109-03 墙面防水列项，不用屋面防水编码
  - id: floor_membrane_not_roof
    ctx_any: [楼地面, 地面, 楼面, 卫生间]
    text_any: [卷材]
    ctx_none: [屋面]
    any_none: [底板]
    forbid: ['010902']
    message: 楼地面卷材防水按 Z010904001 列项，不用屋面卷材编码
  - id: floor_tile_not_wall
    ctx_any: [楼地面, 地面, 楼面]
    text_any: [地砖, 防滑砖, 玻化砖]
    ctx_none: [墙, 踢脚]
    forbid: ['0112']
    message: 楼地面块料按 0111 楼地面块料列项，不用墙面块料编码
  - id: wall_tile_not_floor
    ctx_any: [墙面, 内墙, 外墙, 墙裙]
    text_any: [面砖, 釉面砖, 瓷砖]
    ctx_none: [地面, 楼面, 踢脚]
    forbid: ['0111']
    message: 墙面块料按 011203 墙、柱面块料列项，不用楼地面编码
  - id: ceiling_suspended_not_plaster
    ctx_any: [顶棚, 天棚, 吊顶]
    text_any: [吊顶, 石膏板, 矿棉板, 铝扣板, 硅钙板]
    forbid: ['011301001']
    message: 吊顶按 0113-02 吊顶天棚列项，不是天棚抹灰
  - id: wall_paint_not_plaster
    ctx_any: [墙面, 内墙, 外墙]
    text_any: [涂料, 乳胶漆, 真石漆]
    ctx_none: [顶棚, 天棚]
    text_none: [腻子]
    forbid: ['011201001']
    message: 墙面刷涂料按 011404001「墙面喷刷涂料」列项，不是墙面抹灰
  - id: roof_insulation
    ctx_any: [屋面]
    text_any: [保温, 挤塑, XPS, 聚苯, 岩棉]
    expect: ['011001001']
    message: 屋面保温按 011001001「保温隔热屋面」列项
  # —— WS29-k2（E30）：生产首跑坡道编成台阶 6 条、防水砂浆编成基础涂膜防水、楼梯踏步砂浆编成水泥砂浆楼地面。
  # 只拦明显错的那一类码，不替人选码：坡道面层最终用哪个码由造价员定（D-R184）
  - id: ramp_not_step
    any: [坡道]
    any_none: [台阶, 踏步]
    forbid: ['011107']
    suggest: ['010502031']
    message: 坡道不是台阶装饰（0111-07）。混凝土坡道见 010502031「坡道」；石材、块料坡道面层用哪个码请人工确认
  - id: stair_not_floor
    any: [楼梯, 踏步]
    text_any: [砂浆]
    forbid: ['011101']
    suggest: ['011106001']
    message: 楼梯踏步面层按 0111-06 楼梯面层列项（水泥砂浆面层 011106001「水泥砂浆楼梯」），不用 0111-01 楼地面整体面层编码
  - id: waterproof_mortar_not_coating
    text_any: [防水砂浆]
    forbid: ['010905002', '010903002', '010904002', '010902002']
    suggest: ['010903003', '010904003']
    message: 防水砂浆按砂浆防水列项（墙面 010903003、楼(地)面 Z010904003），不是涂膜防水

# ----------------------------------------------------------------------------- 易混淆对照（注入 prompt）
confusables:
  - 踢脚（含罩面、打底各层）一律按 0111-05 踢脚线列项（单位 m），不用墙面抹灰 Z011201001。
  - 顶棚/天棚刷涂料、乳胶漆 → 011404002 天棚喷刷涂料；Z011301001 只用于天棚抹灰层本身；吊顶 → Z011302xxx。
  - 防水按部位分：屋面 Z010902xxx；墙面 010903xxx；楼(地)面 Z010904xxx；基础底板 Z010905001 / 010905002。
  - 细石混凝土按部位和功能区分：明确楼地面面层才参考 011101002「细石混凝土楼地面」；明确找平层才参考 Z011101007「细石混凝土找平层」；屋面刚性层才参考 Z010902004「屋面刚性层」。保护层不能仅凭名称选面层/找平层，楼面保护层不能选屋面码，争议留空待人工确认；都不是 011101001。
  - 普通地坪漆不能选 011404001「墙面喷刷涂料」。011403001「抹灰面油漆」只在基层及施工语义吻合时作条件候选，011003003「防腐涂料」仅在明确防腐性能时考虑；不要只凭「地坪漆」三个字定码。
  - 普通砌块保护层不是保温隔热墙面，当前层要有保温材料证据，不能借同做法另一个保温主层的材料。010402001「砌块墙」仅用于明确独立砌块墙，保护构造有争议留空待人工确认。
  - 碎石滤水层须保留单层去向，不静默并为辅层；未能确定受控编码时给空串待人工确认，不编造编码。
  - 水泥砂浆：面层 011101001；平面找平层 Z011101006；立面找平层 Z011201004。
  - 块料：楼地面 011102003；墙柱面 011203003；楼梯 011106003；台阶 011107004；踢脚 011105003。
  - 坡道 ≠ 台阶：0111-07 台阶装饰只用于台阶、踏步；混凝土坡道 010502031「坡道」，石材、块料坡道面层不要套台阶编码。
  - 保温：屋面 011001001；墙面 011001003；楼地面 011001005；天棚 011001002。
  - 挡土墙：混凝土 010502026；石 010403004。
  - 结合层、界面剂、素水泥浆、腻子、龙骨、压条、铝板网等是主项的组成部分（aux），不单独列项。

# ----------------------------------------------------------------------------- 标段 / 范围排除（QTY-11；WS29-f）
# 全局排除句：写在说明段落、表注、独立文字行里，作用到所有所选文件。lot / not_in_scope 写在做法层里也管全局。
# secondary 只认谓词句式（「X 为 / 均为 / 属 / 属于 / 作为 / 另做 二次装修」且后面是句末或标点；
# 「X 由二次装修（设计）确定 / 完成」）。下面这些实测全被当成过排除句，都不认：
#   否定「不需 / 不需要 / 无 二次装修」、无谓词「住宅二次装修时，…」「景观及二次装修的材料…」、
#   定语「需二次装修墙面」、引用「厨房设备见二次装修」「注明详二次装修设计部位…」。
exclusion_patterns:
  lot: '(?P<obj>[^。；;\n]{2,80}?)(?:均|全部|统一)?(?:计入|列入|纳入|归入|属于|划入|并入)(?:第)?(?P<lot>[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅪⅫIVXivx0-9一二三四五六七八九十]{1,4})\s*标(?:段)?(?![准高号注识志线])'
  owner: '(?P<obj>[^。；;\n]{2,80}?)(?:均|全部)?由?(?:业主|甲方|建设单位|招标人)(?:自理|自行|另行发包|另行招标|直接发包|指定分包|另行委托)'
  secondary: '(?P<obj>[^。；;\n]{2,80}?)(?<![不非未无])(?:均|全部)?(?<![不非未无])(?:(?:作为|为|属于|属|另做)二次装修(?=\s*(?:$|[。；;，,、！!）)】\]]))|由二次装修(?:设计)?(?:单位)?(?:确定|完成))'
  not_in_scope: '(?P<obj>[^。；;\n]{2,80}?)(?:均|全部)?(?:不在本次|不属于本次|不包括在本次|不含在本次|不在本工程|不在本标段|不属本标段|不在本期)(?:设计|施工|招标)?(?:范围)?'
# 对象词清洗：先去句首条文号（「13.13 」「3、」）和括号残片，再切分、去前后缀。
#   stop_words：功能词，不能作对象词；generic_words：泛指词，不能单独作全局对象词（子串匹配会排掉半张表）；
#   min_cjk：不足这么多个汉字的丢弃（纯数字、纯标点、条文号「13」都过不了）。
exclusion_object:
  split: '[、，,及和与或/]'
  also_split: [等]
  strip_prefix: ['注', '附注', '备注', '说明', '其中', '本工程', '本次', '以下', '另']
  strip_suffix: [等, 部分, 的, 装修, 工程, 做法, 范围, 涂料, 均, 全部]
  min_len: 2
  min_cjk: 2
  stop_words: [不需, 不需要, 无需, 需, 需要, 详, 详见, 见, 按, 等]
  generic_words: [面层, 基层, 找平层, 结合层, 垫层, 防水层, 保温层, 涂料, 抹灰, 装修, 吊顶]

# ----------------------------------------------------------------------------- 层内标记（WS29-f，D-R110 / D-R111）
# 写在做法层正文里的自理、二次装修、精装修引用：只管这一层，不产生全局排除句。优先级见 quantity_rules.find_inline_marker。
inline_owner:
  subjects: [建设单位, 使用单位, 招标人, 购房人, 买受人, 使用方, 业主, 甲方, 用户, 住户, 租户]
  # 正则片段（不转义）：「自行」后面不能是「车」——「住户自行车库」不是自理
  actions: ['另行发包', '另行招标', '直接发包', '指定分包', '另行委托', '自理', '自行(?!车)']
  # 「自理或（详精装修设计）」：两种做法并列，不替人选 → 待核
  alternatives: [或者, 或]
# 本层写明为二次装修（与全局 secondary 同一组谓词，但不要求对象词）。「二次装修」后面是句末、标点或空白：
# 续行并进上一层时中间隔一个空格（「面层为二次装修 详见装修图」），只认句末和标点，并完续行这一层的标记就丢了
inline_secondary: '(?<![不非未无])(?:(?:作为|为|属于|属|另做)二次装修(?=\s|$|[。；;，,、！!（(）)】\]])|由二次装修(?:设计)?(?:单位)?(?:确定|完成))'
inline_fitout_ref:
  # 层正文、做法名称、适用部位都认：「详 / 详见 / 见 / 按」+「精装修 / 二次装修」+ 可选的「设计 / 图纸」
  patterns:
    - '(?:详见|参见|详|见|按)\s*(?:精装修|二次装修)(?:设计|图纸|施工图)?'
  # 只在做法名称、适用部位上认（「内墙6 需二次装修墙面」）；「不需 / 无需二次装修」不算
  name_patterns:
    - '(?<![不无毋])需要?\s*(?:精装修|二次装修)'
# 读到了这些字样、但没有据此排除或标记的句子，列进「说明」页的「范围相关原文」（铁律 8）
scope_related_words: [二次装修, 精装修, 自理]

# ----------------------------------------------------------------------------- 标段号解析（D54）
lot_pattern: '(?:第)?(?P<lot>[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩⅪⅫIVXivx0-9一二三四五六七八九十]{1,4})\s*标(?:段)?(?![准高号注识志线])'

# ----------------------------------------------------------------------------- 存疑闸放行名单（R4F-d fix15 → fix16，用户 2026-10-12 决定 3）
# 带否定字、但本身是固定技术术语（材料属性、规范比较用语、构造类型）的词，不触发「同句含否定/替代/取消表述」降级。
# 匹配（quantity_rules._doubt_safe）：在折叠繁简 / 全角、去空白后的原文上整词匹配，只遮蔽术语本身的字；同一作用域里另有
# 真正的否定（「A级不燃，本层取消」）照常降级。只收术语，绝不收表示用 / 不用、做 / 不做、有 / 没有该层的说法（不采用、不做、
# 不设、取消、无此项、免拆 ……）。共 37 条（上限 40）；每条一个概念（terms 是同一术语的写法变体），理由写在 reason。
# fix16 收紧「整词」（review16a R16A-03、review16b R16B-01 / 02、review16c R16C-02）：
#   · 不跨合同句界（。！？；; 换行）：「本层：无⏎缝隙…」拼不成「无缝」；
#   · 字间隔着空白的写法（「不 少 于」「不 燃 型」）只在术语末字后面也断开时算：「无 机械」= 无 + 机械，不是「无机」；
#   · after：术语后面必须紧接其中之一（after_end: true —— 句末 / 标点 / 字母数字也行；after_materials: true —— 紧接
#     本文件 practice_lexicon.materials 的材料词也行）。首字是否定字、又常是别的词前缀的术语都加了 after（无机 + 房 / 械 /
#     组 不是材料属性）；
#   · not_after：后面紧接其中之一就不是这个术语（「不燃」+ 气 = 不 + 燃气，「除锈」+ 蚀 =「除锈蚀…外」，「无收缩」+ 缝）。
# fix17（协调者 2026-10-13 裁定 1，落实决定 3）：
#   · 删去「不同」「不填料」「不带扶手」：「不同」不是固定技术术语（「与原设计不同」），「不填料」「不带扶手」字面就是做 / 不做、
#     有 / 没有该物（review17b R17B-01 / 04）——名单只剩 37 条；
#   · objects：「无 + 名词」类术语（无框 / 无粘结 / 无黏结 / 无釉 / 无砂 / 无碱），被否定的那个名词在同一合同句里（术语之外）
#     也出现时——否定的正是本层主材（「铝合金门框（无框）」「釉面砖面层（本层无釉）」「砂浆粘结找平层，局部无粘结」）——不放行
#     （review17b 反向探针 rv-x04 的口径）；无框 / 无粘结 仍只认构造类型写法（after：后接 玻璃 / 幕墙 / 门 / 窗 / 预应力 / 筋 …，
#     或在句末作标注「全玻幕墙（无框）」），否定本层主材的写法由 objects 拦下；
#   · after 的术语后面紧接另一个放行术语也算（「无机不燃」= 无机 + 不燃，review17a R17A-06）。
# fix18（review18b R18B-01 / 03 / 04、review18c R18C-03，仍按决定 3 与裁定 1）：
#   · objects 只管「标注 / 谓语」用法——术语靠 after_end 放行（句末 / 括号收尾：「（无框）」「本层无釉」），或前面紧挨着本层 /
#     该层 / 此层 / 局部 / 全部 / 均 / 都 / 亦 … 这类主语 / 范围词（「本层无釉面砖」）；这时在整段原文里（不限同一合同句：
#     「…框格栅装饰面层。本层无框」）、除去所有放行术语出现处之后找被否定的名词。后接 after 词的固定写法照放：同句重复同一术语
#     （全玻无框玻璃幕墙，无框玻璃肋支承）、名词只在别的复合词里（主体钢框架、钢筋粘结长度、网格布耐碱强力）不再挡；
#   · 「无缝」补 objects [缝]（勾缝 / 变形缝 / 嵌缝 +「（无缝）」「本层无缝」照降级）；
#   · after_gap: 4 —— after 词前面可隔 4 个以内的汉字（无釉防滑地砖、无框钢化玻璃门）。名单条目数不变（37 条）。
doubt_safe_terms:
  - terms: [不小于, 不应小于, 不宜小于, 不得小于, 不可小于, 不能小于]
    reason: 规范比较用语（下限要求，如「密度不小于140kg/m³」），说的是指标，不是取舍本层
  - terms: [不大于, 不应大于, 不宜大于, 不得大于, 不可大于, 不能大于]
    reason: 规范比较用语（上限要求，如「接缝宽度不大于2mm」）
  - terms: [不低于, 不应低于, 不宜低于, 不得低于, 不可低于, 不能低于]
    reason: 规范比较用语（下限要求，如「燃烧性能不低于A级」）
  - terms: [不高于, 不应高于, 不宜高于, 不得高于, 不可高于, 不能高于]
    reason: 规范比较用语（上限要求，如「吸水率不高于5%」）
  - terms: [不少于, 不应少于, 不宜少于, 不得少于, 不可少于, 不能少于]
    reason: 规范比较用语（数量下限，如「锚栓不少于6个/m²」）
  - terms: [不多于, 不应多于, 不宜多于, 不得多于, 不可多于, 不能多于]
    reason: 规范比较用语（数量上限，如「渣球含量不多于10%」）
  - terms: [不超过, 不应超过, 不宜超过, 不得超过, 不可超过, 不能超过]
    reason: 规范比较用语（上限，如「单块面积不超过1.2m²」）
  - terms: [不燃, 不燃型, 不燃性, 不燃烧]
    not_after: [气, 油, 料, 煤, 具, 点, 放, 起, 尽, 爆, 香]
    reason: 材料燃烧性能等级（A 级不燃材料、不燃型岩棉板）；后面紧接 气 / 油 / 料 … 时是「不 + 燃气 / 燃油 / 燃料」，照常按「不」降级
  - terms: [无机]
    after: [保温, 轻集料, 集料, 骨料, 填料, 纤维, 喷涂, 涂料, 涂层, 板, 玻璃钢, 胶, 防火, 材料, 非金属, 颜料, 质, 盐, 物, 硅,
            富锌, 渗透, 结晶, 发泡, 树脂, 矿物, 透水, 磨石, 水磨石, 预涂, 人造, 抗裂, 耐磨, 聚合物, 复合, 活性, 界面, 饰面,
            装饰, 密封, 堵漏, 灌浆, 保护, 地坪, 隔热, 隔声, 吸声, 棉, 毡, 防腐, 防水, 粘结, 黏结, 胶粘, 砂浆]
    after_end: true
    after_materials: true
    reason: 材料属性（无机保温砂浆、无机涂料、无机纤维喷涂）；后面紧接 房 / 械 / 组 / 电 … 时是「无 + 机房 / 机械」（无此项），照常按「无」降级
  - terms: [非承重]
    reason: 构件属性（非承重墙、非承重砌块）
  - terms: [非固化]
    reason: 材料名称（非固化橡胶沥青防水涂料）
  - terms: [不锈钢]
    reason: 材料名称（不锈钢锚栓、不锈钢收边条）
  - terms: [无纺布, 无纺]
    reason: 材料名称（无纺布、无纺毡）
  - terms: [非织造]
    reason: 材料名称（非织造布，即无纺布）
  - terms: [无缝]
    after: [钢管, 管, 拼接, 地坪, 焊接, 连接, 对接, 衔接, 墙纸, 墙布, 壁布, 地面, 施工, 一体, 吊顶, 天花, 铺贴, 粘贴, 处理, 卷材, 涂膜]
    after_gap: 4
    not_after: [隙]
    after_end: true
    objects: [缝]
    reason: 材料 / 构造属性（无缝钢管、无缝拼接、无缝地坪）；后面紧接 隙 … 时是「无 + 缝隙」，照常按「无」降级。fix18（review18b R18B-01）：句末 / 括号收尾或「本层」后的「无缝」，整段原文里别处也有「缝」（勾缝 / 变形缝 / 嵌缝，否定的正是本层主材）时不放行
  - terms: [除锈]
    not_after: [蚀]
    reason: 表面处理工序与等级（除锈等级 Sa2.5 / St3），不是去除本层；「除锈蚀严重部位外」是「除…外」的例外句，照常降级
  - terms: [改性]
    after: [沥青, 砂浆, 聚苯, 聚合物, 乳化, 环氧, 石膏, 水泥, 防水, 树脂, 胶, 材料, 剂, 塑料, 涂料, 卷材, 纤维, 混凝土,
            聚氨酯, 硅酮, 丙烯酸, 橡胶, 处理, 岩棉, 挤塑, 玻璃棉, 苯板, 泡沫, 珍珠岩, 膨胀, 硅酸, 酚醛, 发泡, 聚乙烯,
            聚丙烯, 聚氯乙烯, 无机, 腻子, 粘结, 黏结, 密封, 保温, 隔热, EPS, XPS, SBS, APP, PVC, TPO]
    reason: 材料名称（SBS 改性沥青、聚合物改性砂浆、改性聚苯板、改性岩棉板）；后面不是材料 / 工艺名（「改性价比」）照常按「改」降级
  - terms: [无溶剂]
    reason: 材料属性（无溶剂环氧、无溶剂聚氨酯）
  - terms: [无收缩]
    not_after: [缝]
    reason: 材料属性（无收缩灌浆料）；「无收缩缝」是「无 + 收缩缝」，照常降级
  - terms: [不发火]
    reason: 构造类型（不发火地面、不发火细石混凝土）
  - terms: [非金属]
    reason: 材料属性（非金属耐磨骨料、非金属锚栓）
  - terms: [不上人]
    reason: 构造类型（不上人屋面、不上人吊顶）
  - terms: [不透水]
    reason: 材料性能（不透水性、不透水层）
  - terms: [不吸水]
    reason: 材料性能（不吸水的 XPS 板、憎水不吸水）
  - terms: [中空]
    after: [玻璃, 白玻, 夹层, 夹胶, 板, 楼盖]
    reason: 构造类型（中空玻璃；「中空白玻璃」= 中空 + 白玻璃）；后面不是玻璃 / 板（「表中空白」）照常按「空白」降级
  - terms: [无甲醛, 无醛]
    reason: 材料属性（无醛板、无甲醛胶粘剂）
  - terms: [无障碍]
    reason: 设施名称（无障碍卫生间、无障碍坡道）
  - terms: [非机动车]
    reason: 场所名称（非机动车库）
  - terms: [免拆模板, 免拆保温模板, 免拆复合, 免拆体系, 免拆底模]
    reason: 构造类型（免拆模板、免拆复合保温模板）。fix16：只收带「模板 / 复合 / 体系」的整词——「本层免拆」「找平层免拆，直接铺贴」是做 / 不做的说法，照常降级
  # —— fix16 补（按码表名称、规则词典与常见设计说明再核一遍；review16b R16B-05）；fix17 删去「不同」——
  - terms: [非透明]
    after: [幕墙, 部位, 部分, 墙, 玻璃, 围护, 区域, 面板]
    after_end: true
    reason: 构造类型（非透明幕墙，节能设计用语）
  - terms: [非采暖, 非供暖]
    after: [房间, 空间, 区域, 部位, 楼梯间, 地下室, 车库, 层, 区, 用房, 封闭]
    after_end: true
    reason: 空间属性（与非采暖房间相邻的隔墙 / 楼板，节能设计用语）
  - terms: [无框]
    after: [玻璃, 幕墙, 门, 窗, 全玻]
    after_end: true
    after_gap: 4
    objects: [框]
    reason: 构造类型（码表 Z011206006「全玻（无框玻璃）幕墙」、无框玻璃门、全玻幕墙（无框））。fix17：别处也有「框」（门框 / 窗框，否定的正是本层主材）时不放行；fix18：只管句末 / 括号收尾或「本层 / 该门 …」后的标注 / 谓语用法、整段原文里找（「…框格栅面层。本层无框」照降级），后接玻璃 / 门 / 幕墙的固定写法（可隔 4 个汉字：无框钢化玻璃门）照放
  - terms: [无釉]
    after: [面砖, 砖, 瓷砖, 地砖, 陶瓷, 砖面]
    after_end: true
    after_gap: 4
    objects: [釉]
    reason: 材料属性（无釉面砖、无釉地砖）。fix17：别处也有「釉」（釉面砖面层，本层无釉）时不放行；fix18：只管标注 / 谓语用法（含「本层无釉面砖」）、整段原文里找，固定写法照放（可隔 4 个汉字：无釉防滑地砖）
  - terms: [无砂]
    after: [大孔, 混凝土, 透水]
    after_end: true
    after_gap: 4
    objects: [砂]
    reason: 材料名称（无砂大孔混凝土、透水垫层）。fix17：别处也有「砂」（砂浆找平层（无砂））时不放行；fix18：只管标注 / 谓语用法、整段原文里找，固定写法照放
  - terms: [无粘结, 无黏结]
    after: [预应力, 筋, 钢绞线]
    after_end: true
