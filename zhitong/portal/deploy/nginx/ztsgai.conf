# 智通数工AI 门户 ztsgai.com：静态站 + 安装包下载。
#
# 部署与回滚见 zhitong/portal/deploy/runbook.md；本文件由 deploy.sh 上传：
#   容器模式（推荐）：/opt/ztsgai/nginx/conf.d/ztsgai.conf，挂进 zt-nginx 容器的 /etc/nginx/conf.d/
#   宿主模式：        /etc/nginx/conf.d/ztsgai.conf
# 两种模式下下列路径相同（docker-compose.yml 按宿主路径原样挂载），本文件不区分模式：
#   /opt/ztsgai/site                  门户 dist/（deploy.sh 整目录替换）
#   /opt/ztsgai/downloads             安装包、.sha256、releases.json
#   /opt/zhitong/nginx/ssl            旧部署的证书目录（acme.sh 签发，文件名取自旧 deploy.sh render 的默认值）
#   /opt/zhitong/nginx/html           acme.sh HTTP-01 续期写挑战文件的 webroot（旧 deploy/README.md）
# 本文件在 http 上下文被 include，只用本文件自己的 map 变量名（ztsgai_ 前缀），不依赖其它 conf.d 文件。
# 只监听 IPv4：容器默认没有 IPv6，监听 [::] 会让 nginx 起不来。

# 每类路径的缓存与下载头。add_header 只写在 server 级：location 里一旦再写 add_header，
# server 级的安全头就不再继承，所以按 URI 选值，而不是在各 location 里各写一套。
map $uri $ztsgai_cache_control {
    default                                   "no-cache";
    ~^/assets/                                "public, max-age=31536000, immutable";
    # 安装包文件名带版本号，同名文件不覆盖（release-manifest.mjs stage 拒绝覆盖不同内容）。
    ~^/downloads/[^/]+\.(dmg|exe|sha256)$     "public, max-age=2592000";
    ~^/(favicon\.(ico|svg)|apple-touch-icon\.png)$  "public, max-age=86400";
}

map $uri $ztsgai_content_disposition {
    default                                   "";
    ~^/downloads/[^/]+\.(dmg|exe)$            "attachment";
}

# HTTP：只放行证书续期，其余一律跳到 https://ztsgai.com。
server {
    listen 80 default_server;
    server_name ztsgai.com www.ztsgai.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/zhitong/nginx/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://ztsgai.com$request_uri;
    }
}

# www → 裸域。证书是否覆盖 www 见 runbook「检查证书」；不覆盖时浏览器在跳转前就会报证书错误。
server {
    listen 443 ssl http2;
    server_name www.ztsgai.com;

    ssl_certificate     /opt/zhitong/nginx/ssl/ztsgai.com.fullchain.cer;
    ssl_certificate_key /opt/zhitong/nginx/ssl/ztsgai.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://ztsgai.com$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name ztsgai.com;

    ssl_certificate     /opt/zhitong/nginx/ssl/ztsgai.com.fullchain.cer;
    ssl_certificate_key /opt/zhitong/nginx/ssl/ztsgai.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:ztsgai_ssl:10m;
    ssl_session_timeout 1h;

    root  /opt/ztsgai/site;
    index index.html;
    charset utf-8;
    server_tokens off;

    # 安全头。站点只有同源脚本；样式需要 'unsafe-inline'（预渲染 HTML 带 style 属性）。
    # HSTS 沿用旧部署的取舍：先不开，HTTPS 稳定一段时间后再单独评估（max-age 期内无法回退）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cache-Control $ztsgai_cache_control;
    add_header Content-Disposition $ztsgai_content_disposition;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 点文件（含 rsync --partial-dir 的未完成上传）不对外。
    location ~ /\. {
        return 404;
    }

    location ^~ /downloads/ {
        root /opt/ztsgai;
        autoindex off;
        # 只列本目录会出现的类型；types 在 location 里会整体替换继承来的 MIME 表。
        types {
            application/x-apple-diskimage                dmg;
            application/vnd.microsoft.portable-executable exe;
            text/plain                                   sha256;
            application/json                             json;
        }
        default_type application/octet-stream;
        charset_types text/plain application/json;
        sendfile on;
        tcp_nopush on;
        # 大文件：不经代理、不做 gzip（dmg/exe 不在 gzip_types 里），支持断点续传（Range 默认开启）。
        try_files $uri =404;

        # ^~ 前缀匹配跳过 server 级的正则 location，点文件要在这里再拦一次。
        location ~ /\. {
            return 404;
        }
    }

    # 单页站点只有锚点导航，没有前端路由：不存在的路径如实返回 404。
    location / {
        try_files $uri $uri/ =404;
    }
}
