[project]
name = "zt"
version = "0.1.0"
description = "智通数工AI skill 脚本的共享 Python 包：结果信封、CLI 基类与各业务分区。"
requires-python = ">=3.11"
dependencies = [
    "openpyxl",
    "pypdf",
    "PyYAML",
    "python-docx",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
