# 2013 版九部工程量计算规范的「附录名 + 4 位章名」表（WS08-06，issue #724）。
#
# 用途：只做**章名兜底**——code_registry.classify_chapter / chapter_name 先查版本码表
# （gb50854_zj2025.yaml），查不到再查这里，再查不到写「章码 xxxx（章名表里没有）」，绝不裸写「其他」
# （WS26-h2：原先写「附录名·章码」，0602 被说成「矿山工程」）。
# 它不是编码表：没有逐条清单编码，也不参与 lookup()（D53：编码版本只用 zj2025）。
#
# 出处（章节目录，未改字）：
#   01 GB 50854-2013 房屋建筑与装饰工程工程量计算规范  附录 A–S
#   03 GB 50856-2013 通用安装工程工程量计算规范        附录 A–N
#   04 GB 50857-2013 市政工程工程量计算规范            附录 A–L
#   05 GB 50858-2013 园林绿化工程工程量计算规范        附录 A–D
# 02 / 06–09 只录附录名，章名未录，落到「章码 xxxx（章名表里没有）」；附录名仍放在 appendix_name 字段里。
#
# ⚠ D43：章名是人工录入的，合入前须由造价员对照规范目录核对一次（PR 正文列了逐条清单）。
# zj2025 的 0118「措施项目」不改，与本表 0117「措施项目」并存（浙江 2025 版把措施项目编到了 0118）。
